<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
    <defs>
        <linearGradient id="twinCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>
        <linearGradient id="twinOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffb020" />
            <stop offset="100%" stop-color="#ff5500" />
        </linearGradient>
        <filter id="twinGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Cybernetic Dark Hexagon Chassis -->
    <path 
        d="M 24 3 L 43 14 L 43 34 L 24 45 L 5 34 L 5 14 Z" 
        fill="#0b111c" 
        stroke="#38bdf8" 
        stroke-width="1.8" 
        stroke-linejoin="round"
    />

    <!-- Subtle Hexagon Grid Hatching -->
    <path 
        d="M 24 3 L 24 45 M 5 14 L 43 34 M 5 34 L 43 14" 
        stroke="rgba(56, 189, 248, 0.12)" 
        stroke-width="1"
    />

    <!-- Left Hardware Trace (Cyan) -->
    <path 
        d="M 11 17 L 18 24 L 11 31" 
        stroke="url(#twinCyan)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
    />
    <circle cx="11" cy="17" r="3" fill="#38bdf8" filter="url(#twinGlow)" />
    <circle cx="11" cy="31" r="3" fill="#38bdf8" filter="url(#twinGlow)" />

    <!-- Central Quantum Nexus Link -->
    <path 
        d="M 18 24 Q 24 19 30 24" 
        stroke="#38bdf8" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-dasharray="2.5 2"
    />
    <path 
        d="M 18 24 Q 24 29 30 24" 
        stroke="#ff8a00" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-dasharray="2.5 2"
    />

    <!-- Glowing Core Quantum Dot -->
    <circle cx="24" cy="24" r="4.2" fill="#ffffff" filter="url(#twinGlow)" />
    <circle cx="24" cy="24" r="2.2" fill="#ff8a00" />

    <!-- Right Digital Twin Trace (Orange) -->
    <path 
        d="M 37 17 L 30 24 L 37 31" 
        stroke="url(#twinOrange)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
    />
    <circle cx="37" cy="17" r="3" fill="#ff8a00" filter="url(#twinGlow)" />
    <circle cx="37" cy="31" r="3" fill="#ff8a00" filter="url(#twinGlow)" />
</svg>